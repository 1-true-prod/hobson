name: Bug Report
description: Report a bug with hobson
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versions
      description: "`hobson version`, macOS version, and how you installed (one-liner or clone)"
      placeholder: "0.2.0, macOS 26.1, one-liner"
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Paste the output of `hobson doctor`
      render: shell
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Paste the output of `hobson config show`
      render: json

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste relevant lines from `~/.claude/hobson.log` or `hobson monitor`
      render: shell

  - type: dropdown
    id: engine
    attributes:
      label: TTS Engine
      options:
        - say
        - kokoro-realtime
        - chatterbox
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. 15.3
    validations:
      required: true
