<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hobson Setup</title>
<link rel="stylesheet" href="wizard.css">
</head>
<body class="booting">
<canvas id="city" aria-hidden="true"></canvas>
<div id="app">
  <header id="top">
    <span class="brand">HOBSON <b>setup</b></span>
    <span class="v" id="t-node"></span>
    <span class="sp"></span>
    <span class="sfx" id="t-voice">[V] VOICE ON</span>
    <span class="sfx" id="t-sfx">[M] BLIPS ON</span>
    <span class="clock" id="t-clock">--:--:--</span>
  </header>
  <nav id="rail"></nav>
  <main id="main"></main>
  <footer id="status">
    <div class="keys"><span><kbd>↑↓←→</kbd>MOVE</span><span><kbd>⏎</kbd>SELECT</span><span><kbd>ESC</kbd>BACK</span><span><kbd>P</kbd>PREVIEW VOICE</span></div>
    <div class="ticker" id="ticker"></div>
  </footer>
</div>
<script src="city.js"></script>
<script src="art.js"></script>
<script src="wizard.js"></script>
</body>
</html>
